name: Build and Push BiteFact to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: bitefact
  # BiteFact ECS Express service ARN
  EXPRESS_SERVICE_ARN: arn:aws:ecs:us-west-2:299113402161:service/default/BiteFact

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check sw.js
          node --check plans.js
          node --check permissions.js

      - name: Run backend health check
        run: |
          node server.js > /tmp/bitefact-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bitefact-server.log
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::299113402161:role/BiteFactGithubActionsRole

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy BiteFact to ECS Express Mode
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EXPRESS_SERVICE_ARN" = "REPLACE_WITH_BITEFACT_EXPRESS_SERVICE_ARN" ]; then
            echo "EXPRESS_SERVICE_ARN is not set yet; skipping deploy."
            exit 0
          fi

          echo "Deploying image: $IMAGE_URI"
          echo "Express service: $EXPRESS_SERVICE_ARN"

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$EXPRESS_SERVICE_ARN" \
            --primary-container "image=$IMAGE_URI,containerPort=8080,secrets=[{name=ANTHROPIC_API_KEY,valueFrom=/bitefact/ANTHROPIC_API_KEY}]" \
            --monitor-resources

          echo "BiteFact Express Mode deployment started."
