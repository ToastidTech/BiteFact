name: Build and Push BiteFact to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: bitefact
  # Recreated BiteFact ECS service (standard mode, NOT Express)
  ECS_CLUSTER: default
  ECS_SERVICE: BiteFact

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check lead-capture.js
          node --check sw.js
          node --check plans.js
          node --check permissions.js

      - name: Run backend health check
        run: |
          node server.js > /tmp/bitefact-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bitefact-server.log
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::299113402161:role/BiteFactGithubActionsRole

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy BiteFact to ECS
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE_URI"
          echo "Cluster: $ECS_CLUSTER / Service: $ECS_SERVICE"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Current task definition: $CURRENT_TASK_DEF"

          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$CURRENT_TASK_DEF" \
            --query 'taskDefinition' > /tmp/taskdef.json

          FAMILY=$(echo "$CURRENT_TASK_DEF" | sed 's|.*/task-definition/||; s|:.*||')
          echo "Task family: $FAMILY"

          # Register a new revision identical to the current one, except the
          # container image. Secrets (ANTHROPIC_API_KEY, HUBSPOT_ACCESS_TOKEN)
          # stay in the task definition; this step never touches them.
          jq --arg IMG "$IMAGE_URI" '
            del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes)
            | .containerDefinitions |= map(.image = $IMG)
          ' /tmp/taskdef.json > /tmp/new-taskdef.json

          NEW_REVISION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file:///tmp/new-taskdef.json \
            --query 'taskDefinition.revision' \
            --output text)
          echo "Registered revision: $FAMILY:$NEW_REVISION"

          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$FAMILY:$NEW_REVISION" \
            --force-new-deployment

          echo "BiteFact ECS deployment started."
