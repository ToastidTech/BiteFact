<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04060b">
<title>BiteFact — We'll Be Back Soon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#04060b;
    background-image:radial-gradient(ellipse 80% 55% at 50% 38%, rgba(34,197,94,.12), transparent 70%);
    color:#eceaf4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:32px 24px;
    animation:fadein .8s ease-out both;
  }
  @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .card { max-width:400px; }
  .logo {
    width:96px; height:96px; border-radius:24px; object-fit:cover;
    margin:0 auto 28px; display:block;
    box-shadow:0 8px 32px rgba(34,197,94,.30), 0 2px 8px rgba(0,0,0,.5);
    animation:float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .eyebrow {
    font-size:12px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:#8f8fa8; margin-bottom:14px;
  }
  h1 { font-size:30px; font-weight:700; letter-spacing:-.01em; margin-bottom:14px; }
  p { color:#a7a7bf; font-size:16px; line-height:1.65; }
  .brand { margin-top:36px; font-size:13px; color:#55556a; }
  .brand strong { color:#77778f; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="BiteFact logo">
    <div class="eyebrow">BiteFact</div>
    <h1>We'll be back soon</h1>
    <p>We're performing scheduled maintenance to make BiteFact better for you. Thanks for your patience — see you shortly.</p>
    <div class="brand"><strong>Toastid Tech, LLC</strong></div>
  </div>
</body>
</html>
